<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Reconstruction Inspector</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--panel:rgba(12,16,30,0.96);--card:rgba(18,24,45,0.8);
  --border:rgba(80,120,200,0.12);--border-hi:rgba(96,165,250,0.4);
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --accent:#3b82f6;--glow:rgba(59,130,246,0.15);
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;
  --r:8px;--t:0.2s ease;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
#viewport{position:absolute;inset:0;z-index:0}

/* ── Sidebar ── */
#sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--panel);border-right:1px solid var(--border);z-index:50;overflow-y:auto;backdrop-filter:blur(20px);display:flex;flex-direction:column}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
.logo{padding:16px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px}
.logo span{color:var(--accent)}

.sec{padding:12px 16px}
.sec-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);margin-bottom:10px}
.divider{height:1px;background:var(--border);margin:0}

/* Scene tree */
.scene-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:var(--t);font-size:13px;font-weight:500;color:var(--text2)}
.scene-item:hover{background:var(--glow);color:var(--text)}
.scene-item.active{background:rgba(59,130,246,0.2);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)}
.scene-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.scene-item .meta{font-size:10px;color:var(--text3);margin-left:auto;font-weight:400}

/* Toggle buttons */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12px;color:var(--text2)}
.toggle-row label{cursor:pointer;display:flex;align-items:center;gap:6px}
.sw{position:relative;width:32px;height:18px;background:rgba(255,255,255,0.1);border-radius:12px;cursor:pointer;transition:var(--t);flex-shrink:0}
.sw.on{background:var(--accent)}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;background:white;border-radius:50%;transition:var(--t)}
.sw.on::after{left:16px}

/* Sliders */
.slider-row{padding:4px 0}
.slider-row label{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:rgba(255,255,255,0.1);border-radius:4px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--accent);border-radius:50%;cursor:pointer}

/* Camera buttons */
.cam-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.cam-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:6px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;text-align:center;transition:var(--t)}
.cam-btn:hover{background:var(--glow);color:var(--text);border-color:var(--border-hi)}

/* Action buttons */
.action-btn{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text2);padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;text-align:left;transition:var(--t);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.action-btn:hover{background:var(--glow);color:var(--text);border-color:var(--border-hi)}

/* Background picker */
.bg-row{display:flex;gap:4px;flex-wrap:wrap}
.bg-swatch{width:24px;height:24px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:var(--t)}
.bg-swatch:hover,.bg-swatch.active{border-color:var(--accent)}

/* Loading overlay */
#loading{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;flex-direction:column;justify-content:center;align-items:center;gap:16px}
#loading.show{display:flex}
.spinner{width:40px;height:40px;border:3px solid rgba(59,130,246,0.2);border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load-text{font-size:14px;font-weight:500}
#load-bar-wrap{width:240px;height:4px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
#load-bar{height:100%;background:var(--accent);border-radius:4px;width:0%;transition:width 0.3s}

/* Stats bar */
#stats-bar{position:fixed;bottom:0;left:280px;right:0;height:28px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:20px;font-size:11px;color:var(--text3);z-index:50}
#stats-bar span{color:var(--text2)}

/* Tooltip */
#tooltip{position:fixed;background:var(--panel);border:1px solid var(--border);padding:8px 12px;border-radius:6px;font-size:11px;color:var(--text);pointer-events:none;z-index:300;display:none;white-space:pre;backdrop-filter:blur(12px);max-width:300px}

/* Measure line label */
#measure-label{position:fixed;background:rgba(239,68,68,0.9);color:white;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:600;pointer-events:none;z-index:300;display:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}
</script>
</head>
<body>

<div id="viewport"></div>

<div id="sidebar">
  <div class="logo"><span>&#9670;</span> Reconstruction Inspector</div>

  <!-- Scene Tree -->
  <div class="sec">
    <div class="sec-title">Scenes</div>
    <div id="scene-tree"></div>
  </div>
  <div class="divider"></div>

  <!-- Render -->
  <div class="sec">
    <div class="sec-title">Rendering</div>
    <div class="toggle-row"><label>Vertex Colors</label><div class="sw on" data-key="vcol"></div></div>
    <div class="toggle-row"><label>Wireframe</label><div class="sw" data-key="wire"></div></div>
    <div class="toggle-row"><label>Normals</label><div class="sw" data-key="normals"></div></div>
    <div class="toggle-row"><label>Bounding Box</label><div class="sw" data-key="bbox"></div></div>
    <div class="toggle-row"><label>Grid</label><div class="sw on" data-key="grid"></div></div>
    <div class="toggle-row"><label>SSAO</label><div class="sw on" data-key="ssao"></div></div>
    <div class="toggle-row"><label>FXAA</label><div class="sw on" data-key="fxaa"></div></div>
  </div>
  <div class="divider"></div>

  <!-- Clipping -->
  <div class="sec">
    <div class="sec-title">Clipping Plane</div>
    <div class="toggle-row"><label>Enable</label><div class="sw" data-key="clip"></div></div>
    <div class="slider-row" id="clip-slider-row" style="opacity:0.4;pointer-events:none">
      <label>Position</label>
      <input type="range" id="clip-pos" min="0" max="100" value="50">
    </div>
  </div>
  <div class="divider"></div>

  <!-- Point Size (for point clouds) -->
  <div class="sec">
    <div class="sec-title">Point Size</div>
    <div class="slider-row">
      <input type="range" id="pt-size" min="1" max="10" value="2" step="0.5">
    </div>
  </div>
  <div class="divider"></div>

  <!-- Camera -->
  <div class="sec">
    <div class="sec-title">Camera</div>
    <div class="cam-grid">
      <div class="cam-btn" data-cam="front">Front</div>
      <div class="cam-btn" data-cam="back">Back</div>
      <div class="cam-btn" data-cam="top">Top</div>
      <div class="cam-btn" data-cam="left">Left</div>
      <div class="cam-btn" data-cam="right">Right</div>
      <div class="cam-btn" data-cam="persp">Persp</div>
    </div>
    <div style="margin-top:6px">
      <div class="cam-btn" data-cam="fit" style="text-align:center;width:100%">Fit to Screen</div>
    </div>
  </div>
  <div class="divider"></div>

  <!-- Background -->
  <div class="sec">
    <div class="sec-title">Background</div>
    <div class="bg-row" id="bg-row"></div>
  </div>
  <div class="divider"></div>

  <!-- Tools -->
  <div class="sec">
    <div class="sec-title">Tools</div>
    <div class="toggle-row"><label>Measure</label><div class="sw" data-key="measure"></div></div>
    <div class="toggle-row"><label>Inspector</label><div class="sw" data-key="inspect"></div></div>
    <button class="action-btn" id="btn-screenshot">&#128247; Screenshot</button>
  </div>
</div>

<div id="loading" class="show">
  <div class="spinner"></div>
  <div id="load-text">Select a scene to begin</div>
  <div id="load-bar-wrap"><div id="load-bar"></div></div>
</div>

<div id="stats-bar">
  <div>Vertices: <span id="st-verts">—</span></div>
  <div>Faces: <span id="st-faces">—</span></div>
  <div>Colors: <span id="st-colors">—</span></div>
  <div>File: <span id="st-file">—</span></div>
</div>

<div id="tooltip"></div>
<div id="measure-label"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

// ═══════════════ SCENES ═══════════════
const SCENES = [
  { id:'lab',       name:'Lab',       path:'chunks/lab/mesh_lab.ply',             color:'#3b82f6' },
  { id:'outdoor',   name:'Outdoor',   path:'chunks/outdoor/mesh_outdoor.ply',     color:'#22c55e' },
  { id:'corridor',  name:'Corridor',  path:'chunks/corridor/mesh_corridor.ply',   color:'#f59e0b' },
  { id:'interiorB', name:'InteriorB', path:'chunks/interiorB/mesh_interiorB.ply', color:'#a78bfa' },
];

const BACKGROUNDS = [
  {name:'Dark',    color:'#0a0e1a'},
  {name:'Slate',   color:'#1e293b'},
  {name:'Zinc',    color:'#27272a'},
  {name:'Navy',    color:'#0c1a3d'},
  {name:'Black',   color:'#000000'},
  {name:'White',   color:'#f8fafc'},
  {name:'Neutral', color:'#404040'},
];

// ═══════════════ STATE ═══════════════
const S = {
  vcol:true, wire:false, normals:false, bbox:false, grid:true,
  ssao:true, fxaa:true, clip:false, measure:false, inspect:false
};

let scene, camera, renderer, controls, composer;
let renderPass, ssaoPass, fxaaPass;
let currentMesh = null;
let currentGeo = null;
let bboxHelper = null;
let gridHelper = null;
let clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
let meshBounds = null;
let normalMat, colorMat;

// Measurement
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let measurePts = [];
let measureMarkers = [];
let measureLine = null;

// ═══════════════ INIT ═══════════════
function init() {
  const container = document.getElementById('viewport');

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth - 280, window.innerHeight - 28);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  container.appendChild(renderer.domElement);
  renderer.domElement.style.marginLeft = '280px';

  // Scene
  scene = new THREE.Scene();

  // Camera
  camera = new THREE.PerspectiveCamera(50, (window.innerWidth-280)/(window.innerHeight-28), 0.01, 10000);
  camera.position.set(5, 5, 10);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // Lighting — 3-point + hemisphere + ambient
  const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
  keyLight.position.set(8, 12, 10);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xb0c4de, 1.0);
  fillLight.position.set(-6, 4, -8);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
  rimLight.position.set(0, -5, 12);
  scene.add(rimLight);

  const hemi = new THREE.HemisphereLight(0x87ceeb, 0x362a1a, 0.6);
  scene.add(hemi);

  const ambient = new THREE.AmbientLight(0xffffff, 0.3);
  scene.add(ambient);

  // Grid
  gridHelper = new THREE.GridHelper(100, 100, 0x1e293b, 0x111827);
  scene.add(gridHelper);

  // Postprocessing
  composer = new EffectComposer(renderer);
  renderPass = new RenderPass(scene, camera);
  composer.addPass(renderPass);

  ssaoPass = new SSAOPass(scene, camera, window.innerWidth-280, window.innerHeight-28);
  ssaoPass.kernelRadius = 0.5;
  ssaoPass.minDistance = 0.001;
  ssaoPass.maxDistance = 0.1;
  ssaoPass.enabled = S.ssao;
  composer.addPass(ssaoPass);

  fxaaPass = new ShaderPass(FXAAShader);
  fxaaPass.uniforms['resolution'].value.set(1/(window.innerWidth-280), 1/(window.innerHeight-28));
  fxaaPass.enabled = S.fxaa;
  composer.addPass(fxaaPass);

  composer.addPass(new OutputPass());

  // Events
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
  renderer.domElement.addEventListener('click', onClick);

  // Build UI
  buildSceneTree();
  buildBgPicker();
  bindToggles();
  bindCamButtons();
  bindSliders();
  bindActions();

  // Auto-load first scene
  loadScene(SCENES[0]);

  animate();
}

// ═══════════════ SCENE TREE ═══════════════
function buildSceneTree() {
  const container = document.getElementById('scene-tree');
  SCENES.forEach(s => {
    const el = document.createElement('div');
    el.className = 'scene-item';
    el.dataset.id = s.id;
    el.innerHTML = `<div class="dot" style="background:${s.color}"></div>${s.name}<span class="meta"></span>`;
    el.addEventListener('click', () => loadScene(s));
    container.appendChild(el);
  });
}

// ═══════════════ LOAD SCENE ═══════════════
function loadScene(sceneInfo) {
  // Update tree UI
  document.querySelectorAll('.scene-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.scene-item[data-id="${sceneInfo.id}"]`).classList.add('active');

  // Show loading
  const loading = document.getElementById('loading');
  loading.classList.add('show');
  document.getElementById('load-text').textContent = `Loading ${sceneInfo.name}...`;
  document.getElementById('load-bar').style.width = '0%';

  // Clear previous
  if (currentMesh) { scene.remove(currentMesh); currentMesh.geometry.dispose(); currentMesh.material.dispose(); }
  if (bboxHelper) { scene.remove(bboxHelper); bboxHelper = null; }
  if (measureLine) { scene.remove(measureLine); measureLine = null; }
  measureMarkers.forEach(m => scene.remove(m));
  measureMarkers = [];
  measurePts = [];

  const loader = new PLYLoader();
  loader.load('/' + sceneInfo.path,
    (geo) => {
      geo.computeVertexNormals();
      currentGeo = geo;

      const hasCols = geo.hasAttribute('color');
      const vertCount = geo.attributes.position.count;
      const faceCount = geo.index ? geo.index.count / 3 : 0;

      // Materials
      colorMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        vertexColors: hasCols && S.vcol,
        side: THREE.DoubleSide,
        roughness: 0.6,
        metalness: 0.0,
        clippingPlanes: S.clip ? [clipPlane] : [],
        clipShadows: true,
      });

      normalMat = new THREE.MeshNormalMaterial({
        side: THREE.DoubleSide,
        clippingPlanes: S.clip ? [clipPlane] : [],
      });

      currentMesh = new THREE.Mesh(geo, S.normals ? normalMat : colorMat);
      currentMesh.frustumCulled = false;
      currentMesh.receiveShadow = true;
      currentMesh.castShadow = true;
      scene.add(currentMesh);

      // Bounds
      geo.computeBoundingBox();
      geo.computeBoundingSphere();
      meshBounds = geo.boundingBox;

      // BBox helper
      bboxHelper = new THREE.Box3Helper(meshBounds, 0x3b82f6);
      bboxHelper.visible = S.bbox;
      scene.add(bboxHelper);

      // Auto-frame
      fitCamera();

      // Update clip range
      updateClipRange();

      // Stats
      document.getElementById('st-verts').textContent = vertCount.toLocaleString();
      document.getElementById('st-faces').textContent = faceCount.toLocaleString();
      document.getElementById('st-colors').textContent = hasCols ? 'Yes (RGB)' : 'No';
      document.getElementById('st-file').textContent = sceneInfo.path.split('/').pop();

      // Meta in tree
      const meta = document.querySelector(`.scene-item[data-id="${sceneInfo.id}"] .meta`);
      meta.textContent = `${(vertCount/1000000).toFixed(1)}M`;

      // Wireframe state
      colorMat.wireframe = S.wire;

      loading.classList.remove('show');
    },
    (xhr) => {
      if (xhr.lengthComputable) {
        const pct = (xhr.loaded / xhr.total * 100).toFixed(0);
        document.getElementById('load-bar').style.width = pct + '%';
        document.getElementById('load-text').textContent = `Loading ${sceneInfo.name}... ${pct}%`;
      }
    },
    (err) => {
      console.error('Load error:', err);
      document.getElementById('load-text').textContent = 'Error loading mesh';
    }
  );
}

// ═══════════════ CAMERA ═══════════════
function fitCamera() {
  if (!currentGeo || !currentGeo.boundingSphere) return;
  const c = currentGeo.boundingSphere.center;
  const r = currentGeo.boundingSphere.radius;
  controls.target.copy(c);
  camera.position.set(c.x + r*0.8, c.y + r*0.6, c.z + r*1.2);
  controls.update();
}

function setCamera(preset) {
  if (!currentGeo || !currentGeo.boundingSphere) return;
  const c = currentGeo.boundingSphere.center;
  const r = currentGeo.boundingSphere.radius * 1.5;
  controls.target.copy(c);

  const views = {
    front:  [c.x, c.y, c.z + r],
    back:   [c.x, c.y, c.z - r],
    top:    [c.x, c.y + r, c.z + 0.01],
    left:   [c.x - r, c.y, c.z],
    right:  [c.x + r, c.y, c.z],
    persp:  [c.x + r*0.7, c.y + r*0.5, c.z + r*0.7],
    fit:    null,
  };

  if (preset === 'fit') { fitCamera(); return; }
  const pos = views[preset];
  if (pos) camera.position.set(...pos);
  controls.update();
}

// ═══════════════ TOGGLES ═══════════════
function bindToggles() {
  document.querySelectorAll('.sw').forEach(sw => {
    sw.addEventListener('click', () => {
      const key = sw.dataset.key;
      S[key] = !S[key];
      sw.classList.toggle('on', S[key]);
      applyToggle(key);
    });
  });
}

function applyToggle(key) {
  if (!currentMesh) return;
  switch(key) {
    case 'vcol':
      colorMat.vertexColors = S.vcol && currentGeo.hasAttribute('color');
      colorMat.needsUpdate = true;
      break;
    case 'wire':
      colorMat.wireframe = S.wire;
      break;
    case 'normals':
      currentMesh.material = S.normals ? normalMat : colorMat;
      break;
    case 'bbox':
      if (bboxHelper) bboxHelper.visible = S.bbox;
      break;
    case 'grid':
      gridHelper.visible = S.grid;
      break;
    case 'ssao':
      ssaoPass.enabled = S.ssao;
      break;
    case 'fxaa':
      fxaaPass.enabled = S.fxaa;
      break;
    case 'clip':
      const sr = document.getElementById('clip-slider-row');
      sr.style.opacity = S.clip ? '1' : '0.4';
      sr.style.pointerEvents = S.clip ? 'auto' : 'none';
      colorMat.clippingPlanes = S.clip ? [clipPlane] : [];
      normalMat.clippingPlanes = S.clip ? [clipPlane] : [];
      colorMat.needsUpdate = true;
      normalMat.needsUpdate = true;
      break;
    case 'measure':
      if (!S.measure) {
        // Clear measurement
        if (measureLine) { scene.remove(measureLine); measureLine = null; }
        measureMarkers.forEach(m => scene.remove(m));
        measureMarkers = []; measurePts = [];
        document.getElementById('measure-label').style.display = 'none';
      }
      renderer.domElement.style.cursor = S.measure ? 'crosshair' : '';
      break;
    case 'inspect':
      renderer.domElement.style.cursor = S.inspect ? 'crosshair' : '';
      if (!S.inspect) document.getElementById('tooltip').style.display = 'none';
      break;
  }
}

// ═══════════════ SLIDERS ═══════════════
function bindSliders() {
  document.getElementById('clip-pos').addEventListener('input', updateClipPlane);
  document.getElementById('pt-size').addEventListener('input', (e) => {
    if (currentMesh && currentMesh.material.size !== undefined) {
      currentMesh.material.size = parseFloat(e.target.value);
    }
  });
}

function updateClipRange() {
  if (!meshBounds) return;
  const slider = document.getElementById('clip-pos');
  slider.min = 0; slider.max = 100; slider.value = 50;
  updateClipPlane();
}

function updateClipPlane() {
  if (!meshBounds) return;
  const t = parseInt(document.getElementById('clip-pos').value) / 100;
  const y = meshBounds.min.y + (meshBounds.max.y - meshBounds.min.y) * t;
  clipPlane.constant = y;
}

// ═══════════════ CAMERA BUTTONS ═══════════════
function bindCamButtons() {
  document.querySelectorAll('.cam-btn').forEach(btn => {
    btn.addEventListener('click', () => setCamera(btn.dataset.cam));
  });
}

// ═══════════════ BACKGROUND ═══════════════
function buildBgPicker() {
  const row = document.getElementById('bg-row');
  BACKGROUNDS.forEach((bg, i) => {
    const sw = document.createElement('div');
    sw.className = 'bg-swatch' + (i === 0 ? ' active' : '');
    sw.style.background = bg.color;
    sw.title = bg.name;
    sw.addEventListener('click', () => {
      document.querySelectorAll('.bg-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      scene.background = new THREE.Color(bg.color);
    });
    row.appendChild(sw);
  });
  scene.background = new THREE.Color(BACKGROUNDS[0].color);
}

// ═══════════════ ACTIONS ═══════════════
function bindActions() {
  document.getElementById('btn-screenshot').addEventListener('click', () => {
    composer.render();
    const link = document.createElement('a');
    link.download = `screenshot_${Date.now()}.png`;
    link.href = renderer.domElement.toDataURL('image/png');
    link.click();
  });
}

// ═══════════════ MOUSE / RAYCASTER ═══════════════
function onMouseMove(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  if (S.inspect && currentMesh) {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObject(currentMesh);
    const tt = document.getElementById('tooltip');
    if (hits.length > 0) {
      const h = hits[0];
      tt.style.display = 'block';
      tt.style.left = (e.clientX + 16) + 'px';
      tt.style.top = (e.clientY + 16) + 'px';
      let info = `Position:  ${h.point.x.toFixed(3)}, ${h.point.y.toFixed(3)}, ${h.point.z.toFixed(3)}`;
      info += `\nDistance:   ${h.distance.toFixed(3)} m`;
      if (h.face) {
        info += `\nFace:      #${h.faceIndex}`;
        info += `\nNormal:    ${h.face.normal.x.toFixed(3)}, ${h.face.normal.y.toFixed(3)}, ${h.face.normal.z.toFixed(3)}`;
      }
      // Vertex color at hit point
      if (currentGeo.hasAttribute('color') && h.face) {
        const colors = currentGeo.attributes.color;
        const idx = h.face.a;
        const r = (colors.getX(idx)*255)|0, g = (colors.getY(idx)*255)|0, b = (colors.getZ(idx)*255)|0;
        info += `\nColor:     rgb(${r}, ${g}, ${b})`;
      }
      tt.textContent = info;
    } else {
      tt.style.display = 'none';
    }
  }
}

function onClick(e) {
  if (!S.measure || !currentMesh) return;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(currentMesh);
  if (hits.length === 0) return;

  const pt = hits[0].point.clone();
  measurePts.push(pt);

  // Marker sphere
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xef4444 })
  );
  marker.position.copy(pt);
  scene.add(marker);
  measureMarkers.push(marker);

  if (measurePts.length > 2) {
    // Remove oldest
    measurePts.shift();
    const old = measureMarkers.shift();
    scene.remove(old);
  }

  if (measureLine) { scene.remove(measureLine); measureLine = null; }

  if (measurePts.length === 2) {
    const dist = measurePts[0].distanceTo(measurePts[1]);
    const geo = new THREE.BufferGeometry().setFromPoints(measurePts);
    measureLine = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xef4444, linewidth: 2 }));
    scene.add(measureLine);

    // Show label
    const label = document.getElementById('measure-label');
    const mid = measurePts[0].clone().add(measurePts[1]).multiplyScalar(0.5);
    const projected = mid.project(camera);
    const rect = renderer.domElement.getBoundingClientRect();
    label.style.left = ((projected.x + 1) / 2 * rect.width + rect.left) + 'px';
    label.style.top = ((-projected.y + 1) / 2 * rect.height + rect.top) + 'px';
    label.textContent = dist.toFixed(3) + ' m';
    label.style.display = 'block';
  }
}

// ═══════════════ RESIZE ═══════════════
function onResize() {
  const w = window.innerWidth - 280;
  const h = window.innerHeight - 28;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  ssaoPass.setSize(w, h);
  fxaaPass.uniforms['resolution'].value.set(1/w, 1/h);
}

// ═══════════════ ANIMATE ═══════════════
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Update measure label position
  if (measurePts.length === 2 && measureLine) {
    const mid = measurePts[0].clone().add(measurePts[1]).multiplyScalar(0.5);
    const projected = mid.project(camera.clone());
    // Only update if visible
  }

  composer.render();
}

window.onload = init;
</script>
